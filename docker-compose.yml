version: '3.8'

services:
  ochrenotes:
    build:
      context: .
      dockerfile: Dockerfile
    image: ochrenotes:latest
    container_name: ochrenotes_server
    restart: unless-stopped
    # NAS & Host UID:GID mapping (Benutzer-Rechte 2000:100)
    user: "2000:100"
    ports:
      # Frei konfigurierbarer Port über .env oder Umgebungsvariable
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - VAULT_PATH=/data/vault
      - NODE_ENV=production
    volumes:
      # 1. User Ordner mit .md-Dateien der einzelnen Benutzer
      - /srv/NASDRIVE/Files/OchreSuite/User:/data/vault/User
      # 2. System-Konfiguration (users.json, config.json, shares.json)
      - /srv/NASDRIVE/Files/OchreSuite/config:/data/vault
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
