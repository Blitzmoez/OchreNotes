<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Suppress harmless Vite HMR / WebSocket connection errors in AI Studio preview iframe
      (function() {
        function shouldIgnore(msg, file) {
          var str = (msg || '') + ' ' + (file || '');
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            str.indexOf('failed to fetch') !== -1 && str.indexOf('@vite') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          var file = event.filename || '';
          if (shouldIgnore(msg, file)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (shouldIgnore(msg, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>Ochre Suite - Notes</title>
    <meta name="description" content="Modulare Ochre Suite - Selbst-gehosteter Obsidian Markdown Editor mit Tasks, Wissensgraph und Offline-PWA." />
    <meta property="og:title" content="Ochre Suite - Notes" />
    <meta property="og:description" content="Modulare Ochre Suite - Selbst-gehosteter Obsidian Markdown Editor mit Tasks, Wissensgraph und Offline-PWA." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C87D20" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ochre Suite" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
